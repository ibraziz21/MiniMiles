<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusinessOffersDiscovery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:wght@400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link

      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-destructive-foreground: var(--destructive-foreground);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-sans: var(--font-sans);
        --font-heading: var(--font-heading, var(--font-sans));
        --font-serif: var(--font-serif);
        --font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full,
      .rounded-none,
      .rounded-t-full,
      .rounded-t-none,
      .rounded-r-full,
      .rounded-r-none,
      .rounded-b-full,
      .rounded-b-none,
      .rounded-l-full,
      .rounded-l-none,
      .rounded-s-full,
      .rounded-s-none,
      .rounded-e-full,
      .rounded-e-none,
      .rounded-tl-full,
      .rounded-tl-none,
      .rounded-tr-full,
      .rounded-tr-none,
      .rounded-bl-full,
      .rounded-bl-none,
      .rounded-br-full,
      .rounded-br-none,
      .rounded-ss-full,
      .rounded-ss-none,
      .rounded-se-full,
      .rounded-se-none,
      .rounded-es-full,
      .rounded-es-none,
      .rounded-ee-full,
      .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(
          --value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1)
        );
      }

      @layer base {
        * {
          @apply border-border outline-ring/50;
        }
        body {
          @apply bg-background text-foreground font-sans;
        }
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

        --background: #fcfcfc;
        --foreground: #0d0e0c;
        --primary: #238d9d;
        --primary-foreground: #ffffff;
        --secondary: #f2f2f2;
        --secondary-foreground: #0d0e0c;
        --muted: #f2f2f2;
        --muted-foreground: #504c4c;
        --accent: #eaf7f9;
        --accent-foreground: #1e7e8d;
        --destructive: #b42318;
        --destructive-foreground: #ffffff;
        --card: #ffffff;
        --card-foreground: #0d0e0c;
        --popover: #ffffff;
        --popover-foreground: #0d0e0c;
        --border: #e2e2e2;
        --input: #ffffff;
        --ring: #238d9d;
        --chart-1: #238d9d;
        --chart-2: #1e7e8d;
        --chart-3: #0d0e0c;
        --chart-4: #504c4c;
        --chart-5: #e2e2e2;

        --font-sans: "DM Sans", sans-serif;
        --font-heading: "DM Serif Display", sans-serif;
        --font-serif: "Playfair Display", serif;
        --font-mono: "JetBrains Mono", monospace;

        --radius: 0.875rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen bg-background text-foreground flex flex-col">
      <header class="flex items-center justify-between px-4 pt-12 pb-3">
        <button
          class="size-10 rounded-xl border border-border bg-card flex items-center justify-center"
          aria-label="Back"
        >
          <svg
            class="size-5"
            xmlns="http://www.w3.org/2000/svg"
            width="1em"
            height="1em"
            viewBox="0 0 24 24"
          >
            <path
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M15 5L9 12L15 19"
            ></path>
          </svg>
        </button>
        <p class="text-sm text-muted-foreground font-medium">Offers near you</p>
        <p class="text-sm font-medium tabular-nums w-16 text-right">3 / 12</p>
      </header>
      <main class="flex-1 px-4 pt-2 pb-6 flex flex-col">
        <div class="relative flex-1 min-h-[460px]">
          <div
            class="absolute inset-x-3 top-3 bottom-0 rounded-xl border border-border bg-card shadow-sm opacity-80 scale-[0.97]"
          ></div>
          <article
            class="absolute inset-0 rounded-xl border border-border bg-card shadow-md rotate-[-1.5deg] flex flex-col overflow-hidden"
          >
            <div class="relative h-[52%] bg-muted">
              <img
                alt="Akiba Store weekend offer"
                src="https://ggrhecslgdflloszjkwl.supabase.co/storage/v1/object/public/user-assets/MiaYmlO7aLT/components/9BPoho7Mair.jpeg"
                class="size-full object-cover"
              /><span
                class="absolute top-3 left-3 inline-flex items-center gap-1.5 rounded-md bg-card px-2 py-1 text-xs font-medium text-primary border border-border"
                ><span class="size-1.5 rounded-full bg-primary"></span>Available now</span
              ><span
                class="hidden absolute top-4 right-4 rounded-md border-2 border-primary px-2 py-0.5 text-sm font-semibold tracking-wide text-primary -rotate-6"
                >INTERESTED</span
              ><span
                class="hidden absolute top-4 left-4 rounded-md border-2 border-destructive px-2 py-0.5 text-sm font-semibold tracking-wide text-destructive rotate-6"
                >NOT INTERESTED</span
              >
            </div>
            <div class="flex flex-col flex-1 p-4 gap-2">
              <div class="flex items-center justify-between">
                <p class="text-xs font-medium text-muted-foreground uppercase tracking-wider">
                  Akiba Store · Westlands
                </p>
              </div>
              <h2 class="font-heading text-2xl leading-tight text-foreground line-clamp-2">
                Weekend Home &amp; Style Edit: up to 30% off
              </h2>
              <p class="text-sm text-muted-foreground leading-snug line-clamp-2">
                Selected kitchenware, linen and leather goods, in-store Saturday and Sunday.
              </p>
              <div class="mt-auto flex items-center gap-2 text-sm text-foreground">
                <svg
                  class="size-4 text-muted-foreground"
                  xmlns="http://www.w3.org/2000/svg"
                  width="1em"
                  height="1em"
                  viewBox="0 0 24 24"
                >
                  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5">
                    <path
                      d="M2 12C2 8.22876 2 6.34315 3.17157 5.17157C4.34315 4 6.22876 4 10 4H14C17.7712 4 19.6569 4 20.8284 5.17157C22 6.34315 22 8.22876 22 12V14C22 17.7712 22 19.6569 20.8284 20.8284C19.6569 22 17.7712 22 14 22H10C6.22876 22 4.34315 22 3.17157 20.8284C2 19.6569 2 17.7712 2 14V12Z"
                    ></path>
                    <path d="M7 4V2.5"></path>
                    <path d="M17 4V2.5"></path>
                    <path d="M2.5 9H21.5"></path>
                    <path stroke-linejoin="round" d="M17 13H17.0001"></path>
                    <path stroke-linejoin="round" d="M12 13H12.0001"></path>
                    <path stroke-linejoin="round" d="M7 13H7.0001"></path>
                    <path stroke-linejoin="round" d="M17 17.0234H17.0001"></path>
                    <path stroke-linejoin="round" d="M12 17.0234H12.0001"></path>
                    <path stroke-linejoin="round" d="M7 17.0234H7.0001"></path>
                  </g></svg
                ><span>Sat–Sun, 9:00 – 18:00</span>
              </div>
              <div
                class="flex items-center gap-2 text-xs text-muted-foreground border-t border-border pt-2"
              >
                <svg
                  class="size-4"
                  xmlns="http://www.w3.org/2000/svg"
                  width="1em"
                  height="1em"
                  viewBox="0 0 24 24"
                >
                  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5">
                    <path
                      d="M14 11C14 10.4477 14.4477 10 15 10C15.5523 10 16 10.4477 16 11V13C16 13.5523 15.5523 14 15 14C14.4477 14 14 13.5523 14 13V11Z"
                    ></path>
                    <path

                      d="M14.0137 17L14.0079 19.0029C14.0065 19.4731 14.0058 19.7081 13.8595 19.8541C13.7131 20 13.478 20 13.0079 20H9.99502C6.21438 20 4.32407 20 3.14958 18.8284C2.34091 18.0218 2.08903 16.8766 2.01058 15.0105C1.99502 14.6405 1.98724 14.4554 2.05634 14.332C2.12545 14.2085 2.40133 14.0545 2.95308 13.7463C3.56586 13.4041 3.98007 12.7503 3.98007 12C3.98007 11.2497 3.56586 10.5959 2.95308 10.2537C2.40133 9.94554 2.12545 9.79147 2.05634 9.66802C1.98724 9.54458 1.99502 9.35954 2.01058 8.98947C2.08903 7.12339 2.34091 5.97823 3.14958 5.17157C4.32407 4 6.21439 4 9.99502 4H13.5052C13.7814 4 14.0056 4.22298 14.0064 4.49855L14.0137 7C14.0137 7.55228 14.4625 8 15.0162 8C15.5698 8 16.0187 7.55228 16.0187 7V4.51618C16.0187 4.23718 16.2482 4.01169 16.5278 4.0189C18.6952 4.0748 19.9727 4.29604 20.8504 5.17157C21.6591 5.97823 21.911 7.12339 21.9894 8.98947C22.005 9.35954 22.0128 9.54458 21.9437 9.66803C21.8745 9.79147 21.5987 9.94554 21.0469 10.2537C20.4341 10.5959 20.0199 11.2497 20.0199 12C20.0199 12.7503 20.4341 13.4041 21.0469 13.7463C21.5987 14.0545 21.8745 14.2085 21.9437 14.332C22.0128 14.4554 22.005 14.6405 21.9894 15.0105C21.911 16.8766 21.6591 18.0218 20.8504 18.8284C20.0433 19.6336 18.8981 19.8854 17.0336 19.9642C16.5623 19.9841 16.3267 19.994 16.1727 19.8464C16.0187 19.6988 16.0187 19.458 16.0187 18.9765V17C16.0187 16.4477 15.5698 16 15.0162 16C14.4625 16 14.0137 16.4477 14.0137 17Z"
                    ></path>
                  </g></svg
                ><span>No AkibaMiles required</span>
              </div>
            </div>
          </article>
        </div>
        <div class="flex justify-center pt-3 h-8">
          <button class="inline-flex items-center gap-1.5 text-sm font-medium text-primary">
            <svg
              class="size-4"
              xmlns="http://www.w3.org/2000/svg"
              width="1em"
              height="1em"
              viewBox="0 0 24 24"
            >
              <path
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M4 7H15C16.8692 7 17.8039 7 18.5 7.40193C18.9561 7.66523 19.3348 8.04394 19.5981 8.49999C20 9.19615 20 10.1308 20 12C20 13.8692 20 14.8038 19.5981 15.5C19.3348 15.9561 18.9561 16.3348 18.5 16.5981C17.8039 17 16.8692 17 15 17H8.00001M7 10L4 7L7 4"
              ></path></svg
            >Undo
          </button>
        </div>
        <div class="grid grid-cols-3 gap-3 pt-3">
          <button
            class="h-16 rounded-xl border border-border bg-card flex items-center justify-center text-foreground"
            aria-label="Dismiss"
          >
            <svg
              class="size-7"
              xmlns="http://www.w3.org/2000/svg"
              width="1em"
              height="1em"
              viewBox="0 0 24 24"
            >
              <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M14.5 9.50002L9.5 14.5M9.49998 9.5L14.5 14.5"></path>
              </g>
            </svg></button
          ><button
            class="h-16 rounded-xl border border-border bg-card flex items-center justify-center text-foreground"
            aria-label="Remind me"
          >
            <svg
              class="size-7"
              xmlns="http://www.w3.org/2000/svg"
              width="1em"
              height="1em"
              viewBox="0 0 24 24"
            >
              <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5">

                ></path>
                <path
                  d="M7.5 19C8.15503 20.7478 9.92246 22 12 22C14.0775 22 15.845 20.7478 16.5 19"
                ></path>
              </g>
            </svg></button
          ><button
            class="h-16 rounded-xl bg-primary flex items-center justify-center text-primary-foreground"
            aria-label="Interested"
          >
            <svg
              class="size-7"
              xmlns="http://www.w3.org/2000/svg"
              width="1em"
              height="1em"
              viewBox="0 0 24 24"
            >
              <path
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M2 9.1371C2 14 6.01943 16.5914 8.96173 18.9109C10 19.7294 11 20.5 12 20.5C13 20.5 14 19.7294 15.0383 18.9109C17.9806 16.5914 22 14 22 9.1371C22 4.27416 16.4998 0.825464 12 5.50063C7.50016 0.825464 2 4.27416 2 9.1371Z"
              ></path>
            </svg>
          </button>
        </div>
      </main>
    </div>
  </body>
</html>
