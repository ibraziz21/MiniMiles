<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — AkibaMiles Admin</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #F6F8FA;
      color: #0F172A;
    }
    .card {
      max-width: 360px;
      text-align: center;
      background: #FFFFFF;
      border: 1px solid #D7E0E3;
      border-radius: 10px;
      padding: 32px 24px;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #475569; margin: 0 0 20px; }
    button {
      min-height: 44px;
      padding: 0 20px;
      border-radius: 6px;
      border: none;
      background: #0F766E;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #115E59; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You&rsquo;re offline</h1>
    <p>Live administrative data and actions require a connection. No sensitive data is shown while offline.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
